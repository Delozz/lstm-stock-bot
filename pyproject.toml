[project]
name = "stockbot"
version = "0.1.0"
description = "Daily S&P 500 direction model (LSTM + headline sentiment) with walk-forward backtesting and Alpaca paper execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.30",
    "finnhub-python>=2.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "typer>=0.12",
    "vaderSentiment>=3.3.2",
]

[project.scripts]
stockbot = "stockbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockbot"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
